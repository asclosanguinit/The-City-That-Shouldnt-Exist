<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIASTO, KTÓRE NIE POWINNO ISTNIEĆ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- EKRAN GŁÓWNY (MENU) -->
        <div id="main-menu">
            <h1 id="menu-title">MIASTO, KTÓRE NIE POWINNO ISTNIEĆ</h1>
            <p id="menu-subtitle">Visual Novel</p>
            
            <div id="menu-buttons">
                <button id="play-btn" class="menu-btn">GRAJ</button>
                <button id="lang-btn" class="menu-btn">Język: PL 🇵🇱</button>
            </div>
            
            <div id="author-credit">Autor: AscloSanguinit</div>
        </div>

        <!-- PRZYCISK FULLSCREEN -->
        <button id="fullscreen-btn">⛶ Fullscreen</button>

        <!-- TŁO I INTERFEJS GRY -->
        <div id="background"></div>
        <div id="overlay"></div>

        <!-- ZEGAR I CZAS (UI) -->
        <div id="time-display">06:42 | Poniedziałek</div>

        <!-- BOX DIALOGOWY -->
        <div id="dialogue-box">
            <div id="speaker-name">BOHATER</div>
            <div id="dialogue-text">...</div>
            <div id="click-prompt">Dotknij, aby kontynuować ▼</div>
        </div>

        <!-- KONTENER NA WYBORY -->
        <div id="choices-container" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
